name: Site checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  site-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/openings.cjs
      - run: node tests/recruitment.cjs
      - run: node tests/candidate.cjs
      - run: node tests/applications.cjs
      - run: node tests/receipt-function.cjs
      - run: git diff --check
  backend-policies:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: disposable-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: disposable-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate and CV access policies in disposable PostgreSQL
        run: >-
          psql -h localhost -U postgres -v ON_ERROR_STOP=1
          -f tests/backend-bootstrap.sql
          -f supabase/migrations/202610220001_candidate_portal.sql
          -f supabase/migrations/202610250001_job_applications.sql
          -f supabase/migrations/202610250002_application_receipts.sql
          -f tests/backend-policies.sql
          -f tests/application-policies.sql
