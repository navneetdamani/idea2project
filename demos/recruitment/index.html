<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>TalentFlow | Recruitment Demo</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Arial;color:#17243c;background:#f4f7fc}button,input,textarea,select{font:inherit}button{border:0;border-radius:8px;padding:10px 15px;background:#e7edfa;color:#254a9d;cursor:pointer;font-weight:650}button.primary{background:#275ad5;color:white}input,textarea,select{width:100%;border:1px solid #d5deee;border-radius:8px;padding:10px;background:white}textarea{min-height:100px}label{display:block;font-weight:650;margin:10px 0 6px}.shell{display:flex;min-height:100vh}.side{background:#101e36;color:white;width:210px;padding:24px 15px;flex-shrink:0}.logo{font-size:24px;font-weight:800;margin-bottom:30px}.logo span{color:#8ab0ff}.nav{display:block;background:transparent;color:#c0cbe0;width:100%;text-align:left;margin:6px 0}.nav.active{background:#30425f;color:white}.main{flex:1;min-width:0}.top{padding:19px 28px;background:white;border-bottom:1px solid #e1e7f2;display:flex;justify-content:space-between}.page{max-width:1100px;padding:28px;margin:auto}.card{background:white;padding:22px;border:1px solid #e2e8f3;border-radius:14px;margin-bottom:16px;box-shadow:0 3px 15px #14223b08}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.muted{color:#687a95}.tiny{font-size:12px}.badge{background:#e7f1ff;color:#245caa;font-size:11px;padding:5px 9px;border-radius:18px;display:inline-block}.warning{background:#fff4d5;color:#866207;padding:13px;border-radius:10px;margin:0 0 20px}.title{font-size:28px;letter-spacing:-.8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.job h3{margin-bottom:5px}.job{display:flex;flex-direction:column}.job .actions{margin-top:auto;padding-top:16px}.metric{font-size:32px;font-weight:800}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.skill{font-size:11px;padding:5px 8px;background:#eef3fb;border-radius:20px;display:inline-block;margin:2px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid #e7ebf2;padding:12px 7px;font-size:13px}.table th{color:#70809a}.scroll{overflow:auto}dialog{border:0;border-radius:16px;width:min(720px,95vw);max-height:90vh;overflow:auto;padding:25px;box-shadow:0 25px 90px #12213c55}dialog::backdrop{background:#1c294e99}.score{font-weight:800;color:#245ed6;font-size:20px}.meter{height:6px;background:#e7ecf5;border-radius:6px}.meter div{height:100%;background:#2871d6;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fc;padding:13px;border-radius:8px}.hide{display:none}@media(max-width:760px){.shell{display:block}.side{width:100%;display:flex;gap:4px;align-items:center;padding:8px;overflow:auto}.logo{font-size:16px;margin:0 8px}.nav{width:auto;white-space:nowrap}.page{padding:14px}.grid,.cols{grid-template-columns:1fr}.top{padding:12px}}
</style></head><body><div class="shell"><nav class="side"><div class="logo">Talent<span>Flow</span></div><button class="nav active" data-view="overview">Overview</button><button class="nav" data-view="jobs">Job portal</button><button class="nav" data-view="admin">Admin / approvals</button><button class="nav" data-view="candidates">Candidates</button></nav><main class="main"><div class="top"><strong>Recruitment workflow MVP</strong><span class="badge">BROWSER-LOCAL DEMO</span></div><section class="page" id="app"></section></main></div><dialog id="modal"><div id="modalBody"></div></dialog><script>
const KEY="talentflow_sample_v1";
const samples={jobs:[{id:"J101",title:"Senior SAP PS Consultant",location:"Hyderabad / Hybrid",type:"Full-time",years:7,cycles:2,notice:60,skills:["SAP PS","S/4HANA","FI/CO"],public:"Lead SAP PS design, WBS setup, budgeting, settlement and FI/CO integration for enterprise programs.",private:"Fictional confidential internal brief",status:"published"},{id:"J102",title:"SAP BTP Integration Specialist",location:"Bengaluru / Hybrid",type:"Full-time",years:5,cycles:1,notice:60,skills:["SAP BTP","Integration Suite","APIs"],public:"Build enterprise integrations with SAP BTP, Integration Suite and APIs.",private:"Fictional internal contact details",status:"published"},{id:"J103",title:"SAP EPPM Consultant",location:"Pune / Hybrid",type:"Contract",years:6,cycles:2,notice:30,skills:["SAP EPPM","SAP PS"],public:"Configure SAP portfolio and project processes for implementation programs.",private:"Fictional requisition for approval testing",status:"draft"}],candidates:[{id:"C201",job:"J101",name:"Sample Candidate A",email:"a@example.invalid",years:9,cycles:3,notice:30,skills:["SAP PS","S/4HANA","FI/CO"],evidence:"I configured WBS project profiles, budgeting, availability control, settlement and FI/CO integration in three SAP implementations.",technical:"I configured budget profiles and tolerance limits, validated FI postings, corrected settlement rules and supported go-live.",status:"review"},{id:"C202",job:"J101",name:"Sample Candidate B",email:"b@example.invalid",years:4,cycles:1,notice:90,skills:["SAP PS"],evidence:"Assisted a support team.",technical:"I tested reports.",status:"clarify"}],audit:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(samples)}catch{db=structuredClone(samples)}let view="overview",editing=null;
const e=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId=id=>db.jobs.find(j=>j.id===id);
const value=id=>document.getElementById(id).value.trim();
const field=(id,v="",type="text")=>'<label for="'+id+'">'+e(id)+'</label><input type="'+type+'" id="'+id+'" value="'+e(v)+'">';
const skills=s=>(s||[]).map(x=>'<span class="skill">'+e(x)+'</span>').join("");
function persist(action,id){db.audit.unshift({action,id,date:new Date().toLocaleString()});localStorage.setItem(KEY,JSON.stringify(db));render()}
function rank(c){const j=byId(c.job);if(!j)return{n:0,gaps:["Job not found"]};const gaps=[];if(c.years<j.years)gaps.push("Experience below required level");if(c.cycles<j.cycles)gaps.push("Insufficient full-cycle implementations");if(c.notice>j.notice)gaps.push("Joining timeline");const found=j.skills.filter(s=>c.skills.some(t=>t.toLowerCase()===s.toLowerCase()));if(found.length<j.skills.length)gaps.push("Unconfirmed: "+j.skills.filter(s=>!found.includes(s)).join(", "));const n=Math.round(Math.min(1,c.years/j.years)*20+Math.min(1,c.cycles/j.cycles)*15+30*found.length/Math.max(1,j.skills.length)+(c.evidence.length>80?15:c.evidence.length>35?9:2)+(c.technical.length>90?10:c.technical.length>35?6:2)+(c.notice<=j.notice?10:0));return {n,gaps}}
function render(){document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.view===view));let out='<div class="warning">Demo only: Uses fictional sample data and browser storage, not secure authentication or an applicant database. Do not enter real resumes, names, contact details or confidential client JDs.</div>';if(view==="overview"){out+='<div class="row"><div><h1 class="title">Recruitment overview</h1><p class="muted">From confidential requirements to reviewed candidates.</p></div><button class="primary" onclick="newJob()">+ New JD</button></div><div class="grid">'+[['Published jobs',db.jobs.filter(x=>x.status==="published").length],['Pending approvals',db.jobs.filter(x=>x.status==="draft").length],['Applications',db.candidates.length]].map(a=>'<div class="card"><div class="muted">'+a[0]+'</div><div class="metric">'+a[1]+'</div></div>').join("")+'</div><div class="card"><h2>Recruitment workflow</h2><p>1. Enter a fictional JD and prepare client-neutral public copy.</p><p>2. Review the copy and explicitly approve publication.</p><p>3. Candidates answer experience and technical screening questions.</p><p>4. Recruiters review evidence, gaps and demonstration scores.</p><p>5. Obtain separate representation consent before real client submission.</p></div>'}
if(view==="jobs"){out+='<h1 class="title">Open opportunities</h1><p class="muted">Role-specific sample applications with minimum eligibility checks.</p><div class="grid">'+db.jobs.filter(x=>x.status==="published").map(j=>'<div class="card job"><span class="badge">Open</span><h3>'+e(j.title)+'</h3><p class="muted">'+e(j.location)+' · '+e(j.type)+'</p><p>'+e(j.public)+'</p><p>'+skills(j.skills)+'</p><p class="tiny muted">'+j.years+'+ years · '+j.cycles+'+ implementation cycles · Joining within '+j.notice+' days</p><div class="actions"><button class="primary" onclick="apply(\''+j.id+'\')">Apply / screen →</button></div></div>').join("")+'</div>'}
if(view==="admin"){out+='<div class="row"><div><h1 class="title">JD approvals</h1><p class="muted">Private notes are distinct from public job copy.</p></div><button class="primary" onclick="newJob()">+ New JD</button></div><div class="card scroll"><table class="table"><tr><th>Role</th><th>Location</th><th>Approval</th><th>Action</th></tr>'+db.jobs.map(j=>'<tr><td><strong>'+e(j.title)+'</strong><div class="tiny muted">'+e(j.id)+'</div></td><td>'+e(j.location)+'</td><td><span class="badge">'+e(j.status)+'</span></td><td><button onclick="editJob(\''+j.id+'\')">Review</button></td></tr>').join("")+'</table></div>'}
if(view==="candidates"){out+='<h1 class="title">Candidate review</h1><p class="muted">Illustrative deterministic score; not validated to assess hiring suitability.</p><div class="card scroll"><table class="table"><tr><th>Candidate</th><th>Role</th><th>Score</th><th>Eligibility gaps</th><th>Status</th><th>Action</th></tr>'+db.candidates.slice().sort((a,b)=>rank(b).n-rank(a).n).map(c=>{const r=rank(c);return '<tr><td>'+e(c.name)+'</td><td>'+e(byId(c.job)?.title)+'</td><td><span class="score">'+r.n+'</span><div class="meter"><div style="width:'+r.n+'%"></div></div></td><td>'+e(r.gaps.join("; ")||"None reported")+'</td><td>'+e(c.status)+'</td><td><button onclick="review(\''+c.id+'\')">Review</button></td></tr>'}).join("")+'</table></div>'}
document.getElementById("app").innerHTML=out}
function navigate(t){view=t;render()}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>navigate(b.dataset.view));
function popup(html){document.getElementById("modalBody").innerHTML=html;document.getElementById("modal").showModal()}
function close(){document.getElementById("modal").close()}
function newJob(){editing=null;popup('<div class="row"><h2>JD intake</h2><button onclick="close()">Close</button></div><p class="muted">Paste fictional data only.</p>'+field("title","SAP Functional Consultant")+field("location","Hyderabad / Hybrid")+field("years",7,"number")+field("cycles",2,"number")+field("notice",60,"number")+field("skills","SAP PS, S/4HANA, FI/CO")+'<label>Private requirement (not published)</label><textarea id="private" placeholder="Fictional client notes"></textarea><label>Draft public job description</label><textarea id="public" placeholder="Public role description"></textarea><div class="actions"><button class="primary" onclick="create()">Create approval draft</button></div>')}
function create(){if(!value("title")||!value("public"))return alert("Role title and public description required");const j={id:"J"+Date.now(),title:value("title"),location:value("location"),type:"Full-time",years:Number(value("years")),cycles:Number(value("cycles")),notice:Number(value("notice")),skills:value("skills").split(",").map(x=>x.trim()).filter(Boolean),private:value("private"),public:value("public"),status:"draft"};db.jobs.unshift(j);persist("Created draft",j.id);close();editJob(j.id)}
function editJob(id){editing=id;const j=byId(id);popup('<div class="row"><h2>Review and approve · '+e(j.id)+'</h2><button onclick="close()">Close</button></div><p class="warning">Do not publish if the agency-client agreement does not permit advertising this role. Check client identifiers manually.</p><h3>Private original / notes</h3><pre>'+e(j.private)+'</pre>'+field("title",j.title)+field("location",j.location)+field("years",j.years,"number")+field("cycles",j.cycles,"number")+field("notice",j.notice,"number")+field("skills",j.skills.join(", "))+'<label>Public description</label><textarea id="public">'+e(j.public)+'</textarea><label><input style="width:auto" type="checkbox" id="approved"> I confirm authorization and manual confidentiality review.</label><div class="actions"><button onclick="saveJob(false)">Save</button><button class="primary" onclick="saveJob(true)">Approve & publish</button><button onclick="unpublish()">Unpublish</button></div>')}
function saveJob(publish){const j=byId(editing),p=value("public");if(!value("title")||!p)return alert("Required fields missing");if(publish&&!document.getElementById("approved").checked)return alert("Confirm manual approval");if(publish&&/deloitte|@(?:[a-z\d-]+\.)+[a-z]{2,}|\[(?:client|email|reference) removed\]/i.test(p))return alert("Potential client identifier or placeholder in public copy. Rewrite before publishing.");Object.assign(j,{title:value("title"),location:value("location"),years:Number(value("years")),cycles:Number(value("cycles")),notice:Number(value("notice")),skills:value("skills").split(",").map(x=>x.trim()).filter(Boolean),public:p,status:publish?"published":j.status});persist(publish?"Published":"Updated",j.id);close()}
function unpublish(){byId(editing).status="draft";persist("Unpublished",editing);close()}
function apply(id){editing=id;const j=byId(id);popup('<div class="row"><h2>'+e(j.title)+'</h2><button onclick="close()">Close</button></div><p class="warning">Fictional demo applicants only. No resume upload or external transmission.</p>'+field("name","Demo Applicant")+field("email","demo@example.invalid","email")+field("years",j.years,"number")+field("cycles",j.cycles,"number")+field("notice",30,"number")+field("skills",j.skills.join(", "))+'<label>Hands-on implementation examples</label><textarea id="evidence"></textarea><label>Describe a relevant technical implementation issue and how you solved it</label><textarea id="technical"></textarea><label><input style="width:auto" type="checkbox" id="consent"> I consent to this fictional submission being saved in this browser.</label><div class="actions"><button class="primary" onclick="submitCandidate()">Submit demo assessment</button></div>')}
function submitCandidate(){if(!value("name")||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value("email"))||!document.getElementById("consent").checked)return alert("Name, valid email format and demo consent required");if(db.candidates.some(c=>c.job===editing&&c.email.toLowerCase()===value("email").toLowerCase()))return alert("Duplicate application");const c={id:"C"+Date.now(),job:editing,name:value("name"),email:value("email"),years:Number(value("years")),cycles:Number(value("cycles")),notice:Number(value("notice")),skills:value("skills").split(",").map(x=>x.trim()).filter(Boolean),evidence:value("evidence"),technical:value("technical"),status:"review"};db.candidates.unshift(c);persist("Applicant entered",c.id);close();alert("Demo application stored locally; no recruiter has been notified.")}
function review(id){editing=id;const c=db.candidates.find(x=>x.id===id),r=rank(c);popup('<div class="row"><h2>'+e(c.name)+'</h2><button onclick="close()">Close</button></div><p>'+e(byId(c.job)?.title)+' · <span class="score">'+r.n+'/100</span></p><p><strong>Gaps:</strong> '+e(r.gaps.join("; ")||"No claimed eligibility gaps")+'</p><h3>Candidate-reported evidence</h3><pre>'+e(c.evidence)+'</pre><h3>Technical response</h3><pre>'+e(c.technical)+'</pre><p class="warning">The score rewards reported experience, matching skills and answer length, not proven expertise. Recruiter review is mandatory. No candidate representation consent or client submission is implemented.</p><div class="actions"><button class="primary" onclick="setStatus(\'shortlisted\')">Shortlist</button><button onclick="setStatus(\'clarify\')">Clarify</button><button onclick="setStatus(\'review\')">Return to review</button></div>')}
function setStatus(status){db.candidates.find(x=>x.id===editing).status=status;persist("Candidate status "+status,editing);close()}
render();</script></body></html>
